apiVersion: v1
kind: Namespace
metadata: { name: hp-prod }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: pharmacy, namespace: hp-prod }
spec:
  replicas: 1
  selector:
    matchLabels: { app: pharmacy }
  template:
    metadata:
      labels: { app: pharmacy }
    spec:
      containers:
      - name: web
        image: dharma2436/pharmacy:IMAGE_TAG
        ports: [{ containerPort: 5000 }]
        readinessProbe:
          httpGet: { path: /healthz, port: 5000 }
---
apiVersion: v1
kind: Service
metadata: { name: pharmacy-svc, namespace: hp-prod }
spec:
  type: NodePort
  selector: { app: pharmacy }
  ports:
  - port: 80
    targetPort: 5000
    nodePort: 30084
