apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmacy-${COLOR}
  namespace: hp-bg
spec:
  replicas: 1
  selector:
    matchLabels: { app: pharmacy-bg, slot: "${COLOR}" }
  template:
    metadata:
      labels: { app: pharmacy-bg, slot: "${COLOR}" }
    spec:
      containers:
      - name: web
        image: ${APP_IMAGE}
        env:
        - { name: APP_COLOR, value: "${COLOR}" }
        - { name: APP_VERSION, value: "${APP_TAG}" }
        ports: [{ containerPort: 5000 }]
        readinessProbe:
          httpGet: { path: /healthz, port: 5000 }
